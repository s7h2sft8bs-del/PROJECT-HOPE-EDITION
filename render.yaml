services:
  - type: worker
    name: project-hope-v1
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: true
    envVars:
      - key: TRADIER_API_KEY
        sync: false
      - key: TRADIER_ACCOUNT_ID
        sync: false
      - key: TRADIER_BASE_URL
        value: https://sandbox.tradier.com
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: ALERT_PHONE_NUMBER
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"
    plan: starter
    region: ohio
